<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors Game</title>
    <link rel="stylesheet" href="style.css">

</head>
<body>
  
    <h1>Rock Paper Scissors</h1>
    <div class="choices">
        <div class="choice" id="rock">
            <img src="https://tse4.mm.bing.net/th?id=OIP.CASI0FDZOuHLOSVDYJe4JgHaHa&pid=Api&P=0&h=180" alt="">
        </div>


        <div class="choice" id="paper">
          <img src="https://fairuzald.github.io/arc-rock-paper-scissors/src/img/paper.png" alt="">
        </div>


        <div class="choice" id="Scissors">
            <img src="https://tse3.mm.bing.net/th?id=OIP.Yq5brfMgrfiaRyAAPDfZDAHaHv&pid=Api&P=0&h=180" alt="">
        </div>

    </div>

    
        <div class="score-bord">
            <div class="score">
                <p id="user-score">0</p>
                <p>You</p>
            </div>


            <div class="score">
                <p id="comp-score">0</p>
                <p>Comp</p>
            </div>
        </div>
    
    
    <div class="msg-container">
       <p id="msg">Play your move</p> 
    </div>






    <script src="script.js"></script>
</body>
</html>
